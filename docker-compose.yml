services:
  # =========================================================================
  # 1. Frontend (React + Vite + Nginx)
  # =========================================================================
  frontend:
    image: ${REGISTRY:-ghcr.io/muditha}/${FRONTEND_IMAGE:-debtlens-frontend}:${TAG:-latest}
    container_name: debtlens-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - main-backend
    networks:
      - debtlens-network

  # =========================================================================
  # 2. Main Spring Boot Backend (Application Service)
  # =========================================================================
  main-backend:
    image: ${REGISTRY:-ghcr.io/muditha}/${MAIN_BACKEND_IMAGE:-debtlens-main-backend}:${TAG:-latest}
    container_name: debtlens-main-backend
    restart: unless-stopped
    ports:
      - "${MAIN_BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      # Neon PostgreSQL Database
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # CloudAMQP RabbitMQ Broker
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - RABBITMQ_SSL_ENABLED=${RABBITMQ_SSL_ENABLED:-false}
      # RabbitMQ Queue Mappings
      - ANALYSIS_JOB_QUEUE=${ANALYSIS_JOB_QUEUE:-analysis_job_creation.queue}
      - ANALYSIS_RESULT_QUEUE=${ANALYSIS_RESULT_QUEUE:-analysis_job_results.queue}
      - ML_JOB_CREATION_QUEUE=${ML_JOB_QUEUE:-ML_job_cretion.queue}
      - ML_JOB_RESULTS_QUEUE=${ML_RESULT_QUEUE:-ML_job_results.queue}
      # Auth0 Security & Management
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_ROLE_SYSTEM_USER=${AUTH0_ROLE_SYSTEM_USER:-rol_HhD7jrh3qJjAJV4q}
      # App Settings
      - INVITATION_FRONTEND_URL=${INVITATION_FRONTEND_URL:-http://localhost:5173/invitation/accept}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_API_URL=${GITHUB_API_URL:-https://api.github.com}
    networks:
      - debtlens-network

  # =========================================================================
  # 3. Analysis Spring Boot Service (AST / Metrics / Parser)
  # =========================================================================
  analysis-service:
    image: ${REGISTRY:-ghcr.io/muditha}/${ANALYSIS_IMAGE:-debtlens-analysis-service}:${TAG:-latest}
    container_name: debtlens-analysis-service
    restart: unless-stopped
    ports:
      - "${ANALYSIS_PORT:-8082}:8082"
    environment:
      - PORT=8082
      # CloudAMQP RabbitMQ Broker
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - RABBITMQ_SSL_ENABLED=${RABBITMQ_SSL_ENABLED:-false}
      # RabbitMQ Queue Mappings
      - ANALYSIS_JOB_QUEUE=${ANALYSIS_JOB_QUEUE:-analysis_job_creation.queue}
      - ANALYSIS_RESULT_QUEUE=${ANALYSIS_RESULT_QUEUE:-analysis_job_results.queue}
    networks:
      - debtlens-network

  # =========================================================================
  # 4. FastAPI Machine Learning Service (SATD & Bug Prediction)
  # =========================================================================
  ml-service:
    image: ${REGISTRY:-ghcr.io/muditha}/${ML_IMAGE:-debtlens-ml-service}:${TAG:-latest}
    container_name: debtlens-ml-service
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DEBUG=false
      # CloudAMQP RabbitMQ Broker
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - RABBITMQ_ENABLED=true
      # RabbitMQ Queue Mappings
      - ML_JOB_QUEUE=${ML_JOB_QUEUE:-ML_job_cretion.queue}
      - ML_RESULT_QUEUE=${ML_RESULT_QUEUE:-ML_job_results.queue}
    networks:
      - debtlens-network

# =============================================================================
# Internal Docker Bridge Network for Container Inter-communication
# =============================================================================
networks:
  debtlens-network:
    name: debtlens-network
    driver: bridge
